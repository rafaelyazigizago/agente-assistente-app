<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistente · página não encontrada</title>
  <!-- Agente Assistente · a página 404 própria, nas cores do protótipo de 10/11. O GitHub Pages mostra esta página em qualquer endereço que não existe.
       Os estilos vêm aqui dentro: num endereço errado, um caminho relativo para o estilo.css também não existiria. -->
  <style>
    :root { --fundo: #F8F5EE; --tinta: #1E2420; --suave: #47524C; --acao: #14213D; --acao-tinta: #FFFFFF; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --fundo: #151917; --tinta: #E4E9E5; --suave: #C9D2CC; --acao: #8DB4FF; --acao-tinta: #0F1512; color-scheme: dark; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fundo); color: var(--tinta);
      font: 17px/1.5 "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    h1 { font-size: 26px; margin: 12px 0 4px; text-wrap: balance; }
    p { color: var(--suave); margin: 0 0 24px; }
    a { display: inline-block; background: var(--acao); color: var(--acao-tinta); text-decoration: none; font-weight: 700; padding: 16px 24px; border-radius: 12px; }
    a:focus-visible { outline: 3px solid var(--acao); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Esta página não existe.</h1>
    <p>O endereço pode ter um erro de digitação. Suas tarefas estão no lugar de sempre.</p>
    <a href="/agente-assistente-app/">Abrir o Assistente</a>
  </main>
</body>
</html>
