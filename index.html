<!doctype html>
<html lang="pt-BR" data-tema="dia">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Assistente</title>
  <meta name="description" content="Tarefas de Rafael Yazigi: o Hoje e o Travei.">
  <meta name="theme-color" content="#F8F5EE">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone.svg" type="image/svg+xml">
  <link rel="icon" href="icones/icone-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icones/icone-apple-180.png">
  <link rel="preload" href="fontes/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="estilo.css">
  <script src="versao.js"></script>
  <script>
    // Rede de segurança: se o app não começar em 12 s, mostra o porquê e o botão Recarregar.
    // Fica fora do app.js de propósito: funciona até se o app.js nem carregar.
    window.__assistenteErros = [];
    addEventListener('error', function (e) { __assistenteErros.push(String(e.message || (e.target && (e.target.src || e.target.href)) || 'erro')); }, true);
    addEventListener('unhandledrejection', function (e) { __assistenteErros.push(String((e.reason && e.reason.message) || e.reason)); });
    setTimeout(function () {
      if (window.__assistenteIniciou) return;
      var tela = document.getElementById('tela-hoje');
      if (!tela) return;
      var linha = function (tag, classe, texto) { var n = document.createElement(tag); if (classe) n.className = classe; n.textContent = texto; return n; };
      var col = linha('div', 'col sem-cabeca', '');
      var botao = linha('button', 'btn principal mt', 'Recarregar');
      botao.type = 'button';
      botao.onclick = function () { location.reload(); };
      col.appendChild(linha('h1', 'titulo', 'O Assistente não abriu direito'));
      col.appendChild(linha('p', 'sub', 'Nada se perdeu: suas tarefas estão guardadas no banco.'));
      col.appendChild(botao);
      col.appendChild(linha('p', 'nota', 'Se continuar, feche o navegador de vez e abra de novo.'));
      col.appendChild(linha('p', 'nota detalhe', 'Detalhe para o suporte: ' + (__assistenteErros.slice(-2).join(' · ') || 'o app não começou') + ' · versão ' + (self.VERSAO_APP || 'dev')));
      var rol = linha('div', 'rolagem', '');
      rol.appendChild(col);
      tela.textContent = '';
      tela.appendChild(rol);
      document.querySelectorAll('.vista').forEach(function (v) { v.classList.remove('on'); v.hidden = true; });
      tela.classList.add('on');
      tela.hidden = false;
    }, 12000);
  </script>
  <script src="vendor/supabase-2.117.2.js" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
<!-- O app é o protótipo de 10/11/2026 (sobre o v8 de 06/11), em tela cheia, ligado aos dados de verdade.
     Rafael, 11/11/2026: "é isso aqui e somente isso, não quero nada antigo". -->
<section class="tela" id="app">
  <div class="vistas">

    <div class="vista" data-v="entrar" id="tela-entrar" hidden>
      <div class="conteudo">
        <div class="saudacao"><h1>Olá, Rafael.</h1><p>Tudo bem contigo?</p></div>
        <div class="escolhas">
          <button class="botao principal" id="entrar" type="button">Entrar com Google</button>
          <p class="nota" id="erro-entrar" hidden></p>
        </div>
      </div>
    </div>

    <!-- ASSISTENTE (boas-vindas) -->
    <div class="vista" data-v="assistente" id="tela-inicio" hidden></div>

    <!-- HOJE -->
    <div class="vista" data-v="hoje" id="tela-hoje" hidden></div>

    <!-- A TAREFA ABERTA -->
    <div class="vista" data-v="tarefa" id="tela-tarefa" hidden></div>

    <!-- TRAVEI (conversa) -->
    <div class="vista" data-v="travei" id="tela-travei" hidden></div>

    <!-- SEÇÕES AINDA SEM TELA (Rafael, 11/11/2026: "A, como no protótipo") -->
    <div class="vista" data-v="sem-tela" id="tela-sem-tela" hidden><div class="rolagem"><div class="col sem-cabeca">
      <h1 class="titulo" id="titulo-sem-tela"></h1><p class="sub">Ainda sem tela.</p>
    </div></div></div>

  </div>
  <nav class="abas" id="abas" aria-label="Navegação" hidden></nav>
  <div class="veu" id="veu"></div>
  <div class="folha" id="folha" role="dialog"></div>
  <div class="recado" id="recado" role="status" aria-live="polite" hidden><span id="recado-texto"></span><button class="pequeno" id="recado-desfazer" type="button">Desfazer</button></div>
</section>
</body>
</html>
